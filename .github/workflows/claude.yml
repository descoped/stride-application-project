name: Claude

# Two jobs, one action:
#
# - `review` reads a pull request when it is opened or reopened and posts one
#   review. It changes nothing.
# - `respond` answers an `@claude` mention from the owner or a collaborator, in
#   a pull request or an issue: sort out a finding, or fix it and push the fix.
#
# `reopened` is the way to have a pull request reviewed again. Deliberately not
# `synchronize`: that would review every push to every open pull request.
#
# Needs the secret CLAUDE_CODE_OAUTH_TOKEN (set for the descoped organisation)
# and the Claude GitHub app installed on this repository.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # Reviews code changes only, like ci.yml: a pull request that touches nothing
  # but these paths is not reviewed. (Comment and issue events cannot be
  # filtered by path; `respond` acts on them only when someone writes @claude.)
  pull_request:
    types: [opened, reopened]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.claude/**'
      - '.github/workflows/claude.yml'
      - '.github/renovate.json'
      - '.gitignore'
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# A newer opened or reopened event cancels a review that is still running.
# Only for `pull_request`: the action's own "Claude Code is working…" comment
# arrives as `issue_comment` in this same group, and cancelling on that would
# stop the review that wrote it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs on every opened pull request, Renovate's too, so its token cannot
  # write to the repository: a review reads the diff and posts a comment.
  review:
    # No check on who opened it: the instruction is the fixed text below (the
    # pull request's own text never becomes the instruction), and Renovate
    # opens pull requests as an outsider, so a check would end its reviews.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'claude[bot]'
    runs-on: ubuntu-latest
    # A review cut off by the timeout still reports success with a half-filled
    # comment, so the ceiling is generous.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@cc98b3ae241b0fcfb6a42a2690751afffecb4452  # v1 (v1.0.277)
        with:
          # The model is named, not inherited. `Agent` is denied so the review
          # is one pass: a subagent still running when the main turn ends never
          # reports, and nothing is posted. The read-only gh and git commands
          # are granted because the action refuses every Bash call by default.
          claude_args: >-
            --model opus
            --disallowedTools "Agent"
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Review this PR. Read .claude/CLAUDE.md first. Its Philosophy and Hard rules sections hold the never-violate rules: Stride stays small, with core holding only what every application needs and anything optional in an optional module; users choose their own libraries; no dependency is added, swapped or replaced without the owner's decision, and a library that drags in many transitive jars is a defect; core uses HK2 but nothing may block plain forward passing of arguments, so no component may be obtainable only through the locator or only by class name; OIDC/JWT is fully standards compliant and OAuth means 2.1 only; no ThreadLocal or pooled-thread assumptions and nothing that needlessly pins or blocks virtual threads; jakarta.* only, no javax-era workarounds; tests start a real application and assert on status and body, no mocked server and no assertion-free tests; no half-wired features and no special cases by class-name string; CI publishes nothing to the Central Portal, neither a SNAPSHOT nor a release. Review against them as written there, and when you flag a violation name the rule. Also check correctness, thread safety, lifecycle and shutdown behaviour, error handling, changes to public behaviour or defaults that are not called out, that new behaviour comes with tests, hardcoded values and leaked secrets, and AI attribution lines in commits or the PR body (none allowed). The tests are not run here; the CI workflow runs them on JDK 25, the baseline. Distinguish CRITICAL (must fix before merge) from SUGGESTION (non-blocking). Post one concise PR review with file:line citations. If the PR is clean, say so plainly; do not manufacture issues. Complete the entire review within this run and post the consolidated review before ending; never end the turn while any review pass is deferred, backgrounded or promised for later."
          track_progress: true
          allowed_bots: 'renovate[bot]'

      # The job succeeds even when the review never posted: the action edits
      # one placeholder comment in place, and a run that ends early leaves its
      # checklist unticked. An unticked box in that comment fails the job.
      - name: Fail when the review did not post
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq '[.[] | select(.user.login == "claude[bot]")] | last | .body // ""')
          if printf '%s' "$body" | grep -q -- '- \[ \]'; then
            echo "::error::the review comment still has unchecked boxes; the review did not post"
            exit 1
          fi

  respond:
    # The comment or issue text becomes Claude's instruction, with a token that
    # can write and the OAuth secret, so the author must be the owner, a member
    # or a collaborator.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.login != 'claude[bot]' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.login != 'claude[bot]' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.review.user.login != 'claude[bot]' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && github.event.issue.user.login != 'claude[bot]' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      # The baseline JDK, so a fix is built and tested where the oldest
      # supported users run it.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Run Claude Code
        uses: anthropics/claude-code-action@cc98b3ae241b0fcfb6a42a2690751afffecb4452  # v1 (v1.0.277)
        with:
          # No prompt: the action answers the mention. Besides the read-only
          # gh and git commands it may run the Maven build, so a fix is checked
          # here and not only by CI afterwards.
          claude_args: >-
            --model opus
            --disallowedTools "Agent"
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(mvn --batch-mode --no-transfer-progress verify:*),Bash(mvn --batch-mode --no-transfer-progress package:*)"
            --append-system-prompt "Read .claude/CLAUDE.md before changing anything. When you change code, run mvn --batch-mode --no-transfer-progress verify, and push only when it passes; say plainly when it does not. Never add, swap or replace a dependency; describe the options and leave the choice to the owner. Never add AI attribution to a commit message or to pull request text: no Generated-with line, no Co-Authored-By line, no session link."
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
