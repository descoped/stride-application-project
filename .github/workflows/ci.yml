name: CI

# One job on JDK 25, the baseline: every build compiles with `release 25`, so the bytecode does not depend on the
# JDK, and 25 is the oldest runtime users have. Pull requests: build and tests. Pushes to master and release tags add
# coverage and the SonarCloud analysis. Nothing is published from CI: snapshots and releases are published by hand
# (see the `central` profile in stride-application-parent/pom.xml), because the Central Portal limits how often a
# namespace may publish.
on:
  push:
    branches: [master]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.claude/**'
      - '.github/workflows/claude.yml'
      - '.github/renovate.json'
      - '.gitignore'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.claude/**'
      - '.github/workflows/claude.yml'
      - '.github/renovate.json'
      - '.gitignore'
  # To run it on any branch by hand.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch ends the run it replaces, except on master, where every merge
# gets its own SonarCloud analysis.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: Build (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # SonarCloud needs the history to attribute new code.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build and test
        if: github.event_name != 'push'
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Build, test, coverage and SonarCloud
        if: github.event_name == 'push'
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
        run: mvn --batch-mode --no-transfer-progress verify -P coverage,sonar
