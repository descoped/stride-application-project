name: CI

# One job on JDK 21, the baseline: every build compiles with `release 21`, so the bytecode does not depend on the
# JDK, and 21 is the oldest runtime users have. Pull requests: build and tests. Pushes to master and release tags add
# coverage and the SonarCloud analysis; master then publishes a SNAPSHOT.
on:
  push:
    branches: [master]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.claude/**'
      - '.github/workflows/claude.yml'
      - '.github/renovate.json'
      - '.gitignore'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.claude/**'
      - '.github/workflows/claude.yml'
      - '.github/renovate.json'
      - '.gitignore'
  # To run it on any branch by hand.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch ends the run it replaces, except on master, where a run may be
# publishing a SNAPSHOT: there a newer merge waits instead of cancelling an upload half way.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: Build (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # SonarCloud needs the history to attribute new code.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USER
          server-password: CENTRAL_TOKEN_PASSWORD

      - name: Build and test
        if: github.event_name != 'push'
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Build, test, coverage and SonarCloud
        if: github.event_name == 'push'
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
        run: mvn --batch-mode --no-transfer-progress verify -P coverage,sonar

      # Every change merged to master is published as a SNAPSHOT to the Central Portal snapshot repository
      # (https://central.sonatype.com/repository/maven-snapshots/): the parent POM and the four jars with sources
      # and Javadoc; the aggregator POM at the root is not published. Releases are never published from CI.
      - name: Publish SNAPSHOT
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          CENTRAL_TOKEN_USER: ${{ secrets.CENTRAL_TOKEN_USER }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          version=$(sed -n 's/^version=//p' stride-application-config/target/maven-archiver/pom.properties)
          case "$version" in
            *-SNAPSHOT) ;;
            *) echo "::error::master is at $version, not a SNAPSHOT; releases are published by hand"; exit 1 ;;
          esac
          mvn --batch-mode --no-transfer-progress deploy -P central -DskipTests
