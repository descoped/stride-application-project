# Defaults of stride-application-security: JWT bearer authentication for a resource server, off unless enabled.

security.enabled=false
# The authorization server's issuer identifier, an https URL. Its metadata is read at startup from
# /.well-known/oauth-authorization-server (RFC 8414), then /.well-known/openid-configuration, to find the keys.
security.issuer=
# The identifiers of this resource server, comma separated. A token's "aud" must contain one of them.
security.audiences=
security.algorithms=RS256
# at+jwt: tokens follow the JWT profile for access tokens (RFC 9068) and carry iss, exp, aud, sub, client_id, iat and
# jti. JWT: tokens of an authorization server that does not follow the profile; "typ" must then be JWT and client_id
# and jti are not required. With JWT nothing tells an access token from an OpenID Connect ID token but its audience.
security.token-type=at+jwt
# Exact paths that need no token, comma separated
security.public-paths=
# Scopes every request needs, space separated as in OAuth
security.required-scopes=
# The claims that hold the granted scopes and the roles
security.scope-claim=scope
security.roles-claim=roles
# The realm named in the WWW-Authenticate challenge
security.realm=${application.alias}
security.clock-skew-seconds=30

# The authentication filter. It runs after CORS (100), so preflight and rejected requests still get CORS headers,
# and before application filters (1000). An application may instead hand in its own instance named "security";
# an instance is always registered, whatever security.enabled says.
filters.security.enabled=${security.enabled}
filters.security.config.class=io.descoped.stride.application.security.BearerAuthenticationFilter
filters.security.config.pathSpec=/*
filters.security.config.order=200
filters.security.config.dispatches.0=REQUEST
filters.security.config.dispatches.1=FORWARD
filters.security.config.dispatches.2=INCLUDE
filters.security.config.dispatches.3=ASYNC
filters.security.config.dispatches.4=ERROR
