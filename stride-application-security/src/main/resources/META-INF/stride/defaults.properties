# Defaults of stride-application-security: JWT bearer authentication for a resource server, off unless enabled.

security.enabled=false
security.issuer=
security.audiences=
security.algorithms=RS256
security.token-type=at+jwt
security.public-paths=
security.required-scopes=
security.roles-claim=roles
security.clock-skew-seconds=30

# The authentication filter. It runs after CORS (100), so preflight and rejected requests still get CORS headers,
# and before application filters (1000). An application may instead hand in its own instance named "security".
filters.security.enabled=${security.enabled}
filters.security.config.class=io.descoped.stride.application.security.BearerAuthenticationFilter
filters.security.config.pathSpec=/*
filters.security.config.order=200
filters.security.config.dispatches.0=REQUEST
filters.security.config.dispatches.1=FORWARD
filters.security.config.dispatches.2=INCLUDE
filters.security.config.dispatches.3=ASYNC
filters.security.config.dispatches.4=ERROR
