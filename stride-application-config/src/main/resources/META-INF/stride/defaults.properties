# Stride defaults: every configuration key the config, api and core modules read, with its default value.
#
# Every module on the class path may ship a META-INF/stride/defaults.properties declaring its own keys; an optional
# Stride module does, and so can a library or an application. Together they are the lowest configuration layer.
# Anything declared can be overridden by the application's own sources and, because the key is declared, by an
# environment variable or a system property:
# services.jetty.server.config.port <- SERVICES_JETTY_SERVER_CONFIG_PORT or -Dservices.jetty.server.config.port=8080
#
# A key has no default in code. Two modules declaring the same key is an error. Add new keys here.
#
# A build that merges jars into one must append the files of this name, not keep one of them.

logging.verbose=false

application.alias=default
application.version=unknown
# The address clients reach the application at, for example https://api.example.com/v1. Empty: not known.
application.url=

# --- HK2 services -----------------------------------------------------------------------------------------------

services.hk2.defaults.enabled=true
services.hk2.threadpolicy=FULLY_THREADED
# how many services of one run level may start at the same time, each on its own virtual thread
services.hk2.threadcount=20
services.hk2.SystemInjectResolver.enabled=true
services.hk2.HK2TopicDistributionService.enabled=true
services.hk2.DefaultRunLevelContext.enabled=true

# --- Jetty ------------------------------------------------------------------------------------------------------

services.jetty.server.enabled=true
services.jetty.start.enabled=true
services.jetty.server.config.host=localhost
# 0 lets the operating system pick a free port
services.jetty.server.config.port=0
services.jetty.server.config.context-path=/
# Platform threads that accept connections and select I/O. Requests do not use them: each request is handled on a
# new virtual thread, so these numbers do not limit concurrent requests. Nothing does by default: an application
# that needs a ceiling adds a filter with a low order that admits a bounded number of requests.
services.jetty.server.config.minThreads=10
services.jetty.server.config.maxThreads=150
services.jetty.server.config.outputBufferSize=32768
services.jetty.server.config.requestHeaderSize=16384
services.jetty.server.config.idleTimeout=PT30S
# How many connections may wait to be accepted. A connection that arrives when the queue is full is refused or
# reset, so the number must cover a burst of new connections. The operating system caps it (somaxconn). With 0 or
# less the listener gets the Java default of 50.
services.jetty.server.config.acceptQueueSize=1024
# How long requests that are running when the server stops get to finish
services.jetty.server.config.stopTimeout=PT30S
services.jetty.server.config.http2.enabled=true
# Trust X-Forwarded-* headers. Enable only behind a proxy that sanitizes them.
services.jetty.server.config.forwarded.enabled=false

# --- Jersey -----------------------------------------------------------------------------------------------------

services.jersey.objectMapper.enabled=true
services.jersey.server.enabled=true
services.jersey.server.config.mediaTypes.yaml=application/yaml
services.jersey.server.config.mediaTypes.txt=text/plain
services.jersey.server.config.mediaTypes.schema=application/schema+json
services.jersey.server.config.mediaTypes.html=text/html
services.jersey.server.config.mediaTypes.json=application/json

# --- CORS -------------------------------------------------------------------------------------------------------

filters.cors.enabled=true
filters.cors.config.class=io.descoped.stride.application.cors.ApplicationCORSServletFilter
filters.cors.config.pathSpec=/*
# Filters run in ascending order, then by name. A filter without an order is at 1000.
filters.cors.config.order=100
filters.cors.config.dispatches.0=FORWARD
filters.cors.config.dispatches.1=REQUEST
filters.cors.config.origin=*
filters.cors.config.credentials=false
filters.cors.config.headers=origin, content-type, accept, authorization
filters.cors.config.methods=GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD
filters.cors.config.max-age=86400
